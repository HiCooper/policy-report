name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Copy report files
        run: cp -r ./report ./dist/

      - name: Rename reports by ID
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const content = fs.readFileSync('./src/data/reports.ts', 'utf-8');
          const regex = /id:\s*(\d+),[\s\S]*?file:\s*'\/report\/(.+?\.html)'/g;
          const dir = './dist/report/';
          let match;
          while ((match = regex.exec(content)) !== null) {
            const id = match[1];
            const file = match[2];
            const src = path.join(dir, file);
            const dst = path.join(dir, id + '.html');
            if (fs.existsSync(src)) {
              fs.copyFileSync(src, dst);
              console.log('Copied: ' + file + ' -> ' + id + '.html');
            }
          }
          "

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5